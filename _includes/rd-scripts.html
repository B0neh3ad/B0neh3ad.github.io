<script>
  (function () {
    var root = document.documentElement;
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
    function syncGiscus() {
      var frame = document.querySelector("iframe.giscus-frame");
      if (frame) frame.contentWindow.postMessage({ giscus: { setConfig: { theme: current() === "dark" ? "dark_dimmed" : "light" } } }, "https://giscus.app");
    }
    document.querySelectorAll(".rd-theme").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("rd-theme", next); } catch (e) {}
        syncGiscus();
      });
    });
    mq.addEventListener("change", syncGiscus);

    // side TOC: highlight the section currently being read
    var tocLinks = Array.prototype.slice.call(document.querySelectorAll('.rd-toc-side a[href^="#"]'));
    if (tocLinks.length) {
      var heads = tocLinks.map(function (a) { return document.getElementById(decodeURIComponent(a.hash.slice(1))); });
      var spy = function () {
        var line = 140, cur = -1;
        heads.forEach(function (h, i) { if (h && h.getBoundingClientRect().top <= line) cur = i; });
        tocLinks.forEach(function (a, i) { a.classList.toggle("is-current", i === cur); });
      };
      addEventListener("scroll", spy, { passive: true });
      spy();
    }

    // hamburger menu (narrow screens): full-width panel under the header with the main links + category tree
    var header = document.querySelector(".rd-header");
    var burger = document.querySelector(".rd-burger");
    var menu = document.getElementById("rd-menu");
    if (header && burger && menu) {
      var setMenu = function (open) {
        if (open) header.style.setProperty("--hdr-h", Math.round(header.getBoundingClientRect().bottom) + "px");
        header.classList.toggle("is-open", open);
        burger.setAttribute("aria-expanded", open ? "true" : "false");
        burger.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
        menu.inert = !open;
        root.classList.toggle("rd-menu-open", open);
      };
      burger.addEventListener("click", function () { setMenu(!header.classList.contains("is-open")); });
      menu.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && header.classList.contains("is-open")) { setMenu(false); burger.focus(); }
      });
      matchMedia("(min-width: 901px)").addEventListener("change", function (e) { if (e.matches) setMenu(false); });
    }

    // header state: solid background after the photo / first scroll, post title in the bar once the page title has scrolled away
    var cover = document.querySelector(".rd-cover, .rd-hero");
    var pageTitle = document.querySelector(".rd-main--post .rd-article__title, .rd-hero--post .rd-hero__title, .rd-cover--post .rd-cover__title");
    var hasBarTitle = header && header.querySelector(".rd-bar-title");
    var toTop = document.querySelector(".rd-totop");
    var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    var onScroll = function () {
      if (header) {
        var hh = header.offsetHeight;
        var solid = header.classList.contains("rd-header--solid") ? true : cover ? cover.getBoundingClientRect().bottom <= hh + 4 : window.scrollY > 4;
        header.classList.toggle("is-solid", solid);
        if (hasBarTitle && pageTitle) header.classList.toggle("show-title", pageTitle.getBoundingClientRect().bottom <= hh);
      }
      if (toTop) toTop.classList.toggle("is-visible", window.scrollY > Math.min(600, innerHeight * .8));
    };
    addEventListener("scroll", onScroll, { passive: true });
    addEventListener("resize", onScroll);
    addEventListener("load", onScroll);
    addEventListener("pageshow", onScroll);
    onScroll();
    if (toTop) toTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: reduceMotion.matches ? "auto" : "smooth" });
    });

    // home with a full-screen cover: landing-page style section scroll, downward only.
    // One gesture down anywhere on the cover glides to the post list. Scrolling up (and inside the list) stays free.
    var homeCover = document.querySelector(".rd-cover--home");
    if (homeCover) {
      var gliding = false, lockUntil = 0, touchY = null;
      var listTop = function () {
        return Math.round(homeCover.getBoundingClientRect().bottom + window.scrollY - (header ? header.offsetHeight : 0));
      };
      var ease = function (p) { return p < .5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2; };
      var glideTo = function (y) {
        if (reduceMotion.matches) { window.scrollTo(0, y); lockUntil = performance.now() + 300; return; }
        var from = window.scrollY, dist = y - from, t0 = null, dur = 900;
        gliding = true;
        var step = function (ts) {
          if (t0 === null) t0 = ts;
          var p = Math.min(1, (ts - t0) / dur);
          window.scrollTo(0, from + dist * ease(p));
          if (p < 1) requestAnimationFrame(step);
          else { gliding = false; lockUntil = performance.now() + 350; }
        };
        requestAnimationFrame(step);
      };
      var busy = function () { return gliding || performance.now() < lockUntil || root.classList.contains("rd-menu-open"); };
      // returns true when the gesture was turned into a glide
      var route = function (down) {
        var T = listTop();
        if (down && window.scrollY < T - 2) { glideTo(T); return true; }
        return false;
      };
      addEventListener("wheel", function (e) {
        if (root.classList.contains("rd-menu-open") || e.ctrlKey || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        if (gliding || performance.now() < lockUntil) {
          e.preventDefault();
          if (!gliding) lockUntil = performance.now() + 200; // swallow trackpad momentum until it settles
          return;
        }
        if (e.deltaY !== 0 && route(e.deltaY > 0)) e.preventDefault();
      }, { passive: false });
      addEventListener("touchstart", function (e) { touchY = e.touches.length === 1 ? e.touches[0].clientY : null; }, { passive: true });
      addEventListener("touchmove", function (e) {
        if (touchY === null) return;
        if (busy()) { e.preventDefault(); return; }
        var dy = touchY - e.touches[0].clientY;
        if (Math.abs(dy) < 10) return;
        if (route(dy > 0)) { e.preventDefault(); touchY = null; }
      }, { passive: false });
      addEventListener("touchend", function () { touchY = null; }, { passive: true });
      addEventListener("keydown", function (e) {
        if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        var down = e.key === "ArrowDown" || e.key === "PageDown" || (e.key === " " && !e.shiftKey);
        if (!down) return;
        if (busy()) { e.preventDefault(); return; }
        if (route(true)) e.preventDefault();
      });
      var cue = homeCover.querySelector(".rd-cue");
      if (cue) cue.addEventListener("click", function () { if (!busy()) glideTo(listTop()); });
      if (location.hash === "#posts") {
        var settle = function () { var T = listTop(); if (Math.abs(window.scrollY - T) < 24) window.scrollTo(0, T); };
        settle();
        addEventListener("load", settle, { once: true });
      }
    }
  })();
</script>
