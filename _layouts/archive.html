---
layout: default
---

{%- assign rd_design = site.design | default: "walk" -%}
{% include rd-top.html kind="page" title=page.title %}

<div class="rd-body{% if page.sidebar_categories == false %} rd-body--solo{% endif %}">
  {% include rd-sidebar.html %}

  <main id="main" class="rd-main rd-main--archive">
    {%- if rd_design == "walk" or rd_design == "calm" -%}
      <header class="rd-article__head"><h1 class="rd-article__title">{{ page.title }}</h1></header>
    {%- endif -%}
    {{ content }}
  </main>
</div>
